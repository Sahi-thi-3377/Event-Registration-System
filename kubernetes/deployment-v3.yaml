apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-registration-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-registration-v3
  template:
    metadata:
      labels:
        app: event-registration-v3
    spec:
      containers:
        - name: event-registration
          image: sahithi3377/event-registration-system:v3
          ports:
            - containerPort: 5000
