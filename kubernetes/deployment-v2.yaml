apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-registration-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-registration-v2
  template:
    metadata:
      labels:
        app: event-registration-v2
    spec:
      containers:
        - name: event-registration
          image: sahithi3377/event-registration-system:v2
          ports:
            - containerPort: 5000

